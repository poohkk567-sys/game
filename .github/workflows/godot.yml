name: Godot training checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        godot: [4.2.2, 4.6.3]
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot
        env:
          GODOT_VERSION: ${{ matrix.godot }}
        run: |
          mkdir -p work/engine
          curl --fail --location --retry 3 "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o work/engine/godot.zip
          unzip -q work/engine/godot.zip -d work/engine
      - name: Import and run physics integration tests
        env:
          GODOT_VERSION: ${{ matrix.godot }}
        run: GODOT_BIN="$PWD/work/engine/Godot_v${GODOT_VERSION}-stable_linux.x86_64" tools/check.sh

      - name: Render mesh and spritesheet regressions (216 + 192 frames)
        if: matrix.godot == '4.6.3'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          if ! command -v xvfb-run >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y xvfb libgl1-mesa-dri
          fi
          set -o pipefail
          xvfb-run -a -s "-screen 0 1280x720x24" work/engine/Godot_v4.6.3-stable_linux.x86_64 --path . --audio-driver Dummy --fixed-fps 60 --script tests/test_skin_render.gd 2>&1 | tee work/render-check.log
          if rg 'SCRIPT ERROR:|ERROR:' work/render-check.log; then exit 1; fi

          xvfb-run -a -s "-screen 0 1280x720x24" work/engine/Godot_v4.6.3-stable_linux.x86_64 --path . --audio-driver Dummy --fixed-fps 60 --script tests/test_sprite_render.gd 2>&1 | tee work/sprite-render-check.log
          if rg 'SCRIPT ERROR:|ERROR:' work/sprite-render-check.log; then exit 1; fi
